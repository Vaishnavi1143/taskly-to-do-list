<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly | To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">YOUR PERSONAL PRODUCTIVITY SPACE</p>
        <h1>Taskly<span>.</span></h1>
        <p class="subtitle">A little progress each day adds up.</p>
      </div>
      <div class="date-card">
        <span id="dayName"></span>
        <strong id="todayDate"></strong>
      </div>
    </header>

    <section class="summary" aria-label="Task summary">
      <div class="summary-card">
        <span class="summary-label">Total tasks</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Completed</span>
        <strong id="completedCount">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Remaining</span>
        <strong id="remainingCount">0</strong>
      </div>
    </section>

    <section class="task-panel">
      <div class="section-heading">
        <div>
          <h2>My tasks</h2>
          <p>Write it down. Get it done.</p>
        </div>
      </div>

      <form id="taskForm" class="task-form">
        <label class="sr-only" for="taskInput">Enter a task</label>
        <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="100" autocomplete="off" required>
        <button class="add-btn" type="submit">＋ Add task</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>
        <button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <h3>Nothing here yet</h3>
        <p>Add your first task above and make today count.</p>
      </div>
    </section>
    <footer>Made with focus <span>♥</span> and a little JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
